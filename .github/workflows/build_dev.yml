name: Build, Test & Upload - development configuration

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]-alpha[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]-beta[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # gate: test — a tag must never publish an image from an untested state
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The test runner drives a real Chromium through Playwright; npm ci
      # installs the package but not the browser binary itself.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test -- --watch=false --browsers=ChromiumHeadless

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          target: serve_dev
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/senergy-platform/mgw-gui:dev-latest
            ghcr.io/senergy-platform/mgw-gui:dev-${{ github.ref_name }}
