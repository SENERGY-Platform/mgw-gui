name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - next-gen

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # coverage_delta needs history to find the merge base with the target
          fetch-depth: 0

      # gate: secrets (enforce) - scans the working tree, not the history
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-git --no-banner --redact

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The test runner drives a real Chromium through Playwright (needed for
      # the layout- and canvas-dependent specs); npm ci installs the package
      # but not the browser binary itself.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # gate: format (enforce)
      - name: Check formatting
        run: npm run format:check

      # gate: lint (enforce) - reads eslint-suppressions.json, so it reports
      # newly introduced findings rather than the frozen backlog
      - name: Lint
        run: npm run lint

      # gates: build + typecheck (enforce) - tsc runs strict as part of the build
      - name: Build
        run: npm run build

      # gate: test (enforce) - instrumented so coverage_delta below can read the
      # report instead of running the suite a second time
      - name: Test
        run: npm test -- --watch=false --browsers=ChromiumHeadless --coverage

      # gate: coverage_delta (observe until 2026-11-30) - only a pull request has
      # a base branch to measure the changed lines against
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        run: python3 scripts/coverage-delta.py --base "origin/${{ github.base_ref }}" --min 50
        continue-on-error: true

      # gate: deps_license (warn until 2026-10-31, then flip continue-on-error)
      - name: Check dependency licenses
        run: |
          npm install -g license-checker
          . .claude/license-policy.env
          license-checker --production --excludePrivatePackages --onlyAllow "$ALLOWED_NPM"
        continue-on-error: true

      # gate: vulns (enforcing since 2026-08-24 - the audit scope is production
      # dependencies only, and those have been clean since the Angular 21 upgrade)
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
