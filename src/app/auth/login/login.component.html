<spinner [show]="waitingForLogin" class="global-centered-spinner"></spinner>

<div class="login-page">
  <div class="card">
    <div class="brand">
      <span class="brand-mark">
        <mat-icon>hub</mat-icon>
      </span>
      <span class="brand-text">
        <span class="brand-name">MGW</span>
        <span class="brand-sub">Module Gateway</span>
      </span>
    </div>

    <h1>Sign in</h1>

    <div (keydown.enter)="login()" [formGroup]="form" class="form">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input autocomplete="username" formControlName="username" matInput type="text" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input autocomplete="current-password" formControlName="password" matInput type="password" />
      </mat-form-field>

      <button (click)="login()" [disabled]="!form.valid" mat-flat-button type="submit">Sign in</button>
    </div>
  </div>
</div>
