<h1 mat-dialog-title>Refresh repositories</h1>

<div mat-dialog-content>
  @if (hasPendingChangeRequest) {
    <p class="warning">
      Refreshing discards the pending change request.
    </p>
  }

  <p>Select the repositories to refresh:</p>
  @for (repo of repositories; track repo) {
    <div>
      <mat-checkbox [(ngModel)]="selected[repo.Source]">
        {{ repo.Source }} <span class="type">({{ repo.Type }})</span>
      </mat-checkbox>
    </div>
  }
</div>

<div mat-dialog-actions>
  <button [mat-dialog-close]="undefined" mat-button>Cancel</button>
  <button (click)="refresh()" [disabled]="selectedSources().length === 0" color="primary" mat-raised-button>
    Refresh
  </button>
</div>
