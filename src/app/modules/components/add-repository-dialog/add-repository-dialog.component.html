<h2 class="title" mat-dialog-title>{{ 'modules.addRepositoryDialog.title' | transloco }}</h2>

<div class="dialog-content" mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'modules.addRepositoryDialog.type' | transloco }}</mat-label>
    <mat-select [(ngModel)]="repositoryType">
      <mat-option value="github.com">github.com</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'modules.addRepositoryDialog.sourceDefinition' | transloco }}</mat-label>
    <textarea [(ngModel)]="definitionJson" class="definition" matInput rows="12" spellcheck="false"></textarea>
    <mat-hint>{{ 'modules.addRepositoryDialog.hint' | transloco }}</mat-hint>
  </mat-form-field>

  @if (error) {
    <p class="error">{{ error }}</p>
  }
</div>

<div class="actions" mat-dialog-actions>
  <span class="mgw-spacer"></span>
  <button [mat-dialog-close]="undefined" mat-button>{{ 'modules.addRepositoryDialog.cancel' | transloco }}</button>
  <button (click)="save()" mat-flat-button>{{ 'modules.addRepositoryDialog.add' | transloco }}</button>
</div>
