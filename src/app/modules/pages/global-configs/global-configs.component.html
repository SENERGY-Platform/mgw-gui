<div class="layout-margin">

  <div *ngIf="dataSource.data.length === 0 && ready">No global configs defined. Global configs hold values that
    multiple deployments can reference instead of setting them per deployment.
  </div>
  <spinner [show]="!ready" class="global-centered-spinner"></spinner>

  <div [hidden]="(!ready && init) || dataSource.data.length === 0" class="mat-elevation-z1">
    <table [dataSource]="dataSource" mat-table matSort matSortActive="name" matSortDirection="asc">
      <ng-container matColumnDef="name">
        <th *matHeaderCellDef mat-header-cell mat-sort-header>Name</th>
        <td *matCellDef="let config" mat-cell>
          {{ config.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th *matHeaderCellDef mat-header-cell>Type</th>
        <td *matCellDef="let config" mat-cell>
          <span class="type-badge">{{ typeLabel(config) }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="value">
        <th *matHeaderCellDef mat-header-cell>Value</th>
        <td *matCellDef="let config" mat-cell>
          {{ valuePreview(config) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="id">
        <th *matHeaderCellDef mat-header-cell>ID</th>
        <td *matCellDef="let config" class="config-id" mat-cell>
          {{ config.id }}
        </td>
      </ng-container>

      <ng-container matColumnDef="edit">
        <th *matHeaderCellDef class="button-column" mat-header-cell>Edit</th>
        <td *matCellDef="let config" mat-cell>
          <button (click)="edit(config)" color="primary" mat-icon-button matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="delete">
        <th *matHeaderCellDef class="button-column" mat-header-cell>Delete</th>
        <td *matCellDef="let config" mat-cell>
          <button (click)="delete(config)" color="primary" mat-icon-button matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr *matHeaderRowDef="displayColumns; sticky: true" mat-header-row></tr>
      <tr *matRowDef="let m; columns: displayColumns;" mat-row></tr>
    </table>
  </div>
</div>

<div class="fixed-bottom-right-button">
  <button (click)="add()" class="fab" color="primary" mat-fab matTooltip="Add global config">
    <mat-icon>add</mat-icon>
  </button>
</div>
