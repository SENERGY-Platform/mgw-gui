<spinner [show]="!ready"></spinner>

<div *ngIf="ready" class="form-margin">
  <mat-form-field appearance="fill">
    <mat-label>Module Name</mat-label>
    <input [readonly]="true" [value]="module.name" matInput>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Module ID</mat-label>
    <input [readonly]="true" [value]="module.id" matInput>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Author</mat-label>
    <input [readonly]="true" [value]="module.author" matInput>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Version</mat-label>
    <input [readonly]="true" [value]="module.version" matInput>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Repository Source</mat-label>
    <input [readonly]="true" [value]="module.source" matInput>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Repository Channel</mat-label>
    <input [readonly]="true" [value]="module.channel" matInput>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>License</mat-label>
    <input [readonly]="true" [value]="module.license" matInput>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Description</mat-label>
    <input [readonly]="true" [value]="module.description" matInput>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Added</mat-label>
    <input [readonly]="true" [value]="module.added | date: 'short'" matInput>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Updated</mat-label>
    <input [readonly]="true" [value]="module.updated | date: 'short'" matInput>
  </mat-form-field>

  <mat-chip-listbox aria-label="Tags">
    <mat-chip *ngFor="let tag of module.tags">{{ tag }}</mat-chip>
  </mat-chip-listbox>

  <div *ngIf="module.is_deployed">
    <h3>Deployment</h3>

    <mat-form-field appearance="fill">
      <mat-label>Deployment ID</mat-label>
      <input [readonly]="true" [value]="module.deployment.id" matInput>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Status</mat-label>
      <input [readonly]="true" [value]="deploymentStateLabel()" matInput>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Deployed Module Version</mat-label>
      <input [readonly]="true" [value]="module.deployment.module_version" matInput>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Deployed From</mat-label>
      <input [readonly]="true" [value]="module.deployment.module_source + ' / ' + module.deployment.module_channel"
             matInput>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Created</mat-label>
      <input [readonly]="true" [value]="module.deployment.created | date: 'short'" matInput>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Updated</mat-label>
      <input [readonly]="true" [value]="module.deployment.updated | date: 'short'" matInput>
    </mat-form-field>
  </div>

  <div *ngIf="!module.is_deployed">
    <h3>Deployment</h3>
    <p>This module is not deployed.</p>
  </div>
</div>
