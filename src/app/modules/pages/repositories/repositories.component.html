<div class="layout-margin">

  <div *ngIf="dataSource.data.length === 0 && ready">No repositories configured.</div>
  <spinner [show]="!ready" class="global-centered-spinner"></spinner>

  <div [hidden]="(!ready && init) || dataSource.data.length === 0" class="mat-elevation-z1">
    <table [dataSource]="dataSource" mat-table>
      <ng-container matColumnDef="source">
        <th *matHeaderCellDef mat-header-cell>Source</th>
        <td *matCellDef="let repository" mat-cell>
          {{ repository.Source }}
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th *matHeaderCellDef mat-header-cell>Type</th>
        <td *matCellDef="let repository" mat-cell>
          {{ repository.Type }}
        </td>
      </ng-container>

      <ng-container matColumnDef="priority">
        <th *matHeaderCellDef mat-header-cell>Priority</th>
        <td *matCellDef="let repository" mat-cell>
          {{ repository.Priority }}
        </td>
      </ng-container>

      <ng-container matColumnDef="channels">
        <th *matHeaderCellDef mat-header-cell>Channels</th>
        <td *matCellDef="let repository" mat-cell>
          {{ channelNames(repository) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="delete">
        <th *matHeaderCellDef class="button-column" mat-header-cell>Delete</th>
        <td *matCellDef="let repository" mat-cell>
          <button (click)="delete(repository)" [disabled]="repository.Type === 'host-dir'" color="primary"
                  mat-icon-button matTooltip="Delete repository">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr *matHeaderRowDef="displayColumns; sticky: true" mat-header-row></tr>
      <tr *matRowDef="let m; columns: displayColumns;" mat-row></tr>
    </table>
  </div>
</div>

<div class="fixed-bottom-right-button">
  <button (click)="add()" class="fab" color="primary" mat-fab matTooltip="Add repository">
    <mat-icon>add</mat-icon>
  </button>
</div>
