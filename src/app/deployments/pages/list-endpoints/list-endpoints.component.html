<div class="mgw-page">
  <mgw-page-header
    [description]="'deployments.endpointsPage.description' | transloco"
    [title]="'deployments.endpointsPage.title' | transloco"
  ></mgw-page-header>

  <spinner [show]="!ready" class="global-centered-spinner"></spinner>

  @if (ready && groups.length === 0) {
    <mgw-empty-state
      [message]="'deployments.endpointsPage.emptyMessage' | transloco"
      [title]="'deployments.endpointsPage.emptyTitle' | transloco"
      icon="link"
    >
      <button [routerLink]="'/modules'" emptyAction mat-stroked-button>
        {{ 'deployments.endpointsPage.goToModules' | transloco }}
      </button>
    </mgw-empty-state>
  }

  @for (group of groups; track group.ref) {
    <section class="deployment">
      <header class="deployment-head">
        @if (group.moduleId) {
          <mat-icon>extension</mat-icon>
          <a [queryParams]="{tab: 'endpoints'}" [routerLink]="['/modules/detail', group.moduleId]">{{ group.name }}</a>
          @if (group.name !== group.moduleId) {
            <span class="mgw-mono group-id">{{ group.moduleId }}</span>
          }
        } @else {
          <mat-icon>rocket_launch</mat-icon>
          <span [title]="'deployments.endpointsPage.unlabelledHint' | transloco" class="mgw-mono">{{ group.ref }}</span>
        }
      </header>
      <list-endpoints [deploymentID]="group.ref"></list-endpoints>
    </section>
  }
</div>
