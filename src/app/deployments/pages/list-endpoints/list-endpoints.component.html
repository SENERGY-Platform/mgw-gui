<div class="mgw-page">
  <mgw-page-header
    [description]="'deployments.endpointsPage.description' | transloco"
    [title]="'deployments.endpointsPage.title' | transloco"
  ></mgw-page-header>

  <spinner [show]="!ready" class="global-centered-spinner"></spinner>

  @if (ready && deploymentIDs.length === 0) {
    <mgw-empty-state
      [message]="'deployments.endpointsPage.emptyMessage' | transloco"
      [title]="'deployments.endpointsPage.emptyTitle' | transloco"
      icon="link"
    >
      <button [routerLink]="'/modules'" emptyAction mat-stroked-button>
        {{ 'deployments.endpointsPage.goToModules' | transloco }}
      </button>
    </mgw-empty-state>
  }

  @for (deploymentID of deploymentIDs; track deploymentID) {
    <section class="deployment">
      <header class="deployment-head">
        <mat-icon>rocket_launch</mat-icon>
        <span class="mgw-mono">{{ deploymentID }}</span>
      </header>
      <list-endpoints [deploymentID]="deploymentID"></list-endpoints>
    </section>
  }
</div>
