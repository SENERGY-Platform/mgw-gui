<div class="layout-margin">
  <spinner [show]="!ready" class="global-centered-spinner"></spinner>

  <div *ngIf="ready">
    <h2>Create deployment</h2>
    <p *ngIf="modules.length > 1" class="hint">The module and its dependencies are deployed together — one section per
      module.</p>
    <p *ngIf="modules.length === 0">Nothing to deploy: the module and all its dependencies are already deployed.</p>

    <deployment-form *ngFor="let module of modules" [globalConfigs]="globalConfigs" [hostResources]="hostResources"
                     [module]="module" [secrets]="secrets"></deployment-form>

    <div class="actions">
      <button (click)="cancel()" [disabled]="submitting" mat-button>Cancel</button>
      <button (click)="submit()" *ngIf="modules.length > 0" [disabled]="submitting" color="primary"
              mat-raised-button>Deploy
      </button>
    </div>
  </div>
</div>
