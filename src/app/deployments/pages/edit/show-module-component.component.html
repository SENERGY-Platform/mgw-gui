<div class="mgw-page mgw-page-narrow has-action-bar">
  <spinner [show]="!ready" class="global-centered-spinner"></spinner>

  @if (ready) {
    <mgw-page-header
      [description]="descriptionKey() | transloco: {count: modules.length}"
      [title]="titleKey() | transloco"
      backTo="/modules"
    ></mgw-page-header>

    @if (updatePending()) {
      <div class="mgw-notice warn">
        <mat-icon>upgrade</mat-icon>
        <span>{{ 'deployments.editDeployment.updateNotice' | transloco }}</span>
      </div>
    }

    @if (modules.length === 0) {
      <mgw-empty-state
        [message]="'deployments.editDeployment.noneEditableMessage' | transloco"
        [title]="'deployments.editDeployment.nothingToEdit' | transloco"
        icon="info"
      >
        <button [routerLink]="'/modules'" emptyAction mat-stroked-button>
          {{ 'deployments.editDeployment.backToModules' | transloco }}
        </button>
      </mgw-empty-state>
    }

    @for (module of modules; track module.id) {
      <deployment-form
        [globalConfigs]="globalConfigs"
        [hostResources]="hostResources"
        [module]="module"
        [prefill]="true"
        [secrets]="secrets"
      ></deployment-form>
    }

    @if (modules.length > 0) {
      <div class="mgw-action-bar">
        <button (click)="cancel()" [disabled]="submitting" mat-button>
          {{ 'deployments.editDeployment.cancel' | transloco }}
        </button>
        <button (click)="submit()" [disabled]="submitting" mat-flat-button>
          <mat-icon>save</mat-icon>
          {{ 'deployments.editDeployment.save' | transloco }}
        </button>
      </div>
    }
  }
</div>
