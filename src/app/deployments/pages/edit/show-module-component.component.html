<div class="layout-margin">
  <spinner [show]="!ready" class="global-centered-spinner"></spinner>

  <div *ngIf="ready && module">
    <h2>Edit deployment</h2>
    <p *ngIf="updatePending()" class="update-hint">
      The installed module is at {{ module.version }} while the deployment was created for
      {{ module.deployment.module_version }} — saving applies the update to the deployment.
    </p>

    <deployment-form [globalConfigs]="globalConfigs" [hostResources]="hostResources" [module]="module"
                     [prefill]="true" [secrets]="secrets"></deployment-form>

    <div class="actions">
      <button (click)="cancel()" [disabled]="submitting" mat-button>Cancel</button>
      <button (click)="submit()" [disabled]="submitting" color="primary" mat-raised-button>Save</button>
    </div>
  </div>
</div>
