<spinner [show]="!ready"></spinner>

<div *ngIf="ready && dataSource.data.length === 0" class="empty">
  No auxiliary deployments. Modules spawn and manage them on their own; the UI only shows their state.
</div>

<table *ngIf="ready && dataSource.data.length > 0" [dataSource]="dataSource" class="mat-elevation-z1" mat-table>
  <ng-container matColumnDef="status">
    <th *matHeaderCellDef class="button-column" mat-header-cell>Status</th>
    <td *matCellDef="let aux" mat-cell>
      <div *ngIf="statusOf(aux) === 'healthy'" class="circle green" matTooltip="Running"></div>
      <div *ngIf="statusOf(aux) === 'unhealthy'" class="circle red"
           matTooltip="{{aux.container?.state || 'container missing'}} {{aux.container?.health}}"></div>
      <div *ngIf="statusOf(aux) === 'disabled'" class="circle grey" matTooltip="Disabled"></div>
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th *matHeaderCellDef mat-header-cell>Name</th>
    <td *matCellDef="let aux" mat-cell>{{ aux.name }}</td>
  </ng-container>

  <ng-container matColumnDef="reference">
    <th *matHeaderCellDef mat-header-cell>Reference</th>
    <td *matCellDef="let aux" mat-cell>{{ aux.reference }}</td>
  </ng-container>

  <ng-container matColumnDef="image">
    <th *matHeaderCellDef mat-header-cell>Image</th>
    <td *matCellDef="let aux" mat-cell>{{ aux.image }}</td>
  </ng-container>

  <ng-container matColumnDef="updated">
    <th *matHeaderCellDef mat-header-cell>Updated</th>
    <td *matCellDef="let aux" mat-cell>{{ aux.updated | date: 'short' }}</td>
  </ng-container>

  <tr *matHeaderRowDef="displayColumns" mat-header-row></tr>
  <tr *matRowDef="let m; columns: displayColumns;" mat-row></tr>
</table>
