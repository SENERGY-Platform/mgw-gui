<h1 mat-dialog-title>{{ context }}</h1>

<div class="dialog-content" mat-dialog-content>
  @if (source) {
    <p class="source">Source: {{ source }}</p>
  }
  @if (detail) {
    <pre class="detail">{{ detail }}</pre>
  }
  @if (!detail) {
    <p>No further details were reported.</p>
  }
</div>

<div mat-dialog-actions>
  <button [mat-dialog-close]="undefined" color="primary" mat-raised-button>Close</button>
</div>
