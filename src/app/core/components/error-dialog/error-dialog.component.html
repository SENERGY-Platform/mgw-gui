<h2 class="title" mat-dialog-title>
  <mat-icon>error</mat-icon>
  {{ context }}
</h2>

<div class="dialog-content" mat-dialog-content>
  @if (source) {
    <p class="source">{{ source }}</p>
  }
  @if (detail) {
    <pre class="detail">{{ detail }}</pre>
  } @else {
    <p class="none">No further details were reported.</p>
  }
</div>

<div class="actions" mat-dialog-actions>
  <span class="mgw-spacer"></span>
  <button [mat-dialog-close]="undefined" mat-flat-button>Close</button>
</div>
