<h2 class="title" mat-dialog-title>{{ 'core.confirmDialog.title' | transloco }}</h2>

<div class="dialog-content" mat-dialog-content>
  <p class="message">{{ message }}</p>
</div>

<div class="actions" mat-dialog-actions>
  <span class="mgw-spacer"></span>
  <button (click)="cancel()" mat-button>{{ 'core.confirmDialog.cancel' | transloco }}</button>
  <button (click)="confirm()" mat-flat-button>{{ 'core.confirmDialog.confirm' | transloco }}</button>
</div>
