@if (language.availableLangs.length > 1) {
  <button
    [attr.aria-label]="'core.languageSwitch.label' | transloco"
    [matMenuTriggerFor]="menu"
    [matTooltip]="'core.languageSwitch.label' | transloco"
    mat-icon-button
  >
    <mat-icon>translate</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    @for (code of language.availableLangs; track code) {
      <button (click)="language.set(code)" [class.active]="language.lang() === code" mat-menu-item>
        {{ code }}
      </button>
    }
  </mat-menu>
}
