<header class="app-bar">
  <button (click)="toggleDrawer()" aria-label="Toggle navigation" mat-icon-button
          matTooltip="Toggle navigation">
    <mat-icon>menu</mat-icon>
  </button>

  <a class="brand" routerLink="/overview">
    <span class="brand-mark">
      <mat-icon>hub</mat-icon>
    </span>
    <span class="brand-text">
      <span class="brand-name">MGW</span>
      <span class="brand-sub">Module Gateway</span>
    </span>
  </a>

  <span class="spacer"></span>

  <button (click)="theme.next()" [matTooltip]="theme.label()" aria-label="Switch theme" mat-icon-button>
    <mat-icon>{{ theme.icon() }}</mat-icon>
  </button>

  <button [matMenuTriggerFor]="userMenu" aria-label="Account" mat-icon-button matTooltip="Account">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu" [overlapTrigger]="false">
    <div class="menu-caption">Signed in</div>
    <mat-divider></mat-divider>
    <button (click)="logout()" mat-menu-item>
      <mat-icon>logout</mat-icon>
      <span>Log out</span>
    </button>
  </mat-menu>
</header>

<mat-sidenav-container [class.collapsed]="collapsed() && !compact()" class="shell">
  <mat-sidenav [mode]="compact() ? 'over' : 'side'" [opened]="drawerOpen()"
               (closedStart)="drawerOpen.set(false)" class="nav-drawer">
    <div class="drawer-inner">
      <nav class="nav">
        @for (item of navItems; track item.route) {
          @if (item.children?.length) {
            <button (click)="toggleSection(item)" [class.active]="isSectionActive(item)"
                    [matTooltipDisabled]="!collapsed() || compact()" [matTooltip]="item.label"
                    class="nav-item" matTooltipPosition="right" type="button">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span class="nav-label">{{ item.label }}</span>
              <mat-icon [class.rotated]="isSectionExpanded(item)" class="chevron">expand_more</mat-icon>
            </button>
            <div [class.expanded]="isSectionExpanded(item) && !(collapsed() && !compact())" class="nav-children">
              <div class="nav-children-inner">
                @for (child of item.children; track child.route) {
                  <a [routerLinkActiveOptions]="{exact: !!child.exact}" [routerLink]="child.route"
                     class="nav-item nav-child" routerLinkActive="active">
                    <mat-icon>{{ child.icon }}</mat-icon>
                    <span class="nav-label">{{ child.label }}</span>
                  </a>
                }
              </div>
            </div>
          } @else {
            <a [matTooltipDisabled]="!collapsed() || compact()" [matTooltip]="item.label"
               [routerLinkActiveOptions]="{exact: !!item.exact}" [routerLink]="item.route" class="nav-item"
               matTooltipPosition="right" routerLinkActive="active">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span class="nav-label">{{ item.label }}</span>
            </a>
          }
        }
      </nav>

      <div class="nav-footer">
        <span class="nav-label">Version {{ uiVersion }}</span>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
