<h2 class="title" mat-dialog-title>Send feedback</h2>

<div [class.has-screenshot]="capture" class="dialog-content" mat-dialog-content>
  <!-- Capped to a comfortable line length of its own, even while the dialog
       around it is nearly full-screen for the screenshot editor below - a
       wide dialog is not the same as a text field anyone wants that wide. -->
  <div class="form-fields">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Message</mat-label>
      <textarea [(ngModel)]="message" matInput required rows="4"></textarea>
    </mat-form-field>

    <div class="name-email">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name (optional)</mat-label>
        <input [(ngModel)]="name" matInput type="text" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email (optional)</mat-label>
        <input [(ngModel)]="email" matInput type="email" />
      </mat-form-field>
    </div>

    @if (screenshotSupported && !capture) {
      <button (click)="takeScreenshot()" mat-button type="button">Add screenshot</button>
      @if (screenshotError) {
        <p class="error" role="alert">{{ screenshotError }}</p>
      }
    }
  </div>

  @if (screenshotSupported && capture) {
    <mgw-screenshot-editor [(redactions)]="redactions" [capture]="capture" class="editor"></mgw-screenshot-editor>
    <button (click)="removeScreenshot()" mat-button type="button">Remove screenshot</button>
  }

  <div class="form-fields">
    @if (replayOffered) {
      <mat-checkbox [(ngModel)]="includeReplay">Include a recording of what happened</mat-checkbox>
    }

    @if (error) {
      <p class="error" role="alert">{{ error }}</p>
    }
  </div>
</div>

<div class="actions" mat-dialog-actions>
  <span class="mgw-spacer"></span>
  <button (click)="cancel()" [disabled]="sending" mat-button type="button">Cancel</button>
  <button (click)="submit()" [disabled]="sending || !message.trim()" mat-flat-button type="button">Send</button>
</div>
