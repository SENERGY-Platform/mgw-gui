<h1 mat-dialog-title>{{ title }}</h1>

<div class="dialog-content" mat-dialog-content>
  @if (failedCount() > 0) {
    <p class="summary">{{ failedCount() }} of {{ items.length }} item(s) failed.</p>
  }

  @for (item of items; track item) {
    <div [class.failed]="!item.ok" class="item">
      @if (item.ok) {
        <mat-icon class="ok-icon">check_circle</mat-icon>
      }
      @if (!item.ok) {
        <mat-icon class="failed-icon">error</mat-icon>
      }
      <div class="item-body">
        <div class="label">{{ item.label }}</div>
        @if (item.message) {
          <div class="message">{{ item.message }}</div>
        }
        @if (item.hint) {
          <div class="hint">{{ item.hint }}</div>
        }
      </div>
    </div>
  }
</div>

<div mat-dialog-actions>
  <button [mat-dialog-close]="undefined" color="primary" mat-raised-button>Close</button>
</div>
