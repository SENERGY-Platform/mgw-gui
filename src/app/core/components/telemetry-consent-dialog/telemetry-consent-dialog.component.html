<h2 class="title" mat-dialog-title>{{ 'core.telemetryConsent.title' | transloco }}</h2>

<div class="dialog-content" mat-dialog-content>
  <p class="message">
    {{ 'core.telemetryConsent.message' | transloco }}
  </p>

  <mat-radio-group
    (change)="select($event.value)"
    [value]="selected()"
    [attr.aria-label]="'core.telemetryConsent.howMuch' | transloco"
    class="options"
  >
    @for (option of options; track option.id) {
      <mat-radio-button [attr.data-level]="option.id" [value]="option.level" class="option">
        <span class="option-label">{{ option.label | transloco }}</span>
        <span class="option-description">{{ option.description | transloco }}</span>
      </mat-radio-button>
    }
  </mat-radio-group>
</div>

<div class="actions" mat-dialog-actions>
  <span class="mgw-spacer"></span>
  <button (click)="cancel()" mat-button>{{ 'core.telemetryConsent.notNow' | transloco }}</button>
  <button (click)="save()" mat-flat-button>{{ 'core.telemetryConsent.save' | transloco }}</button>
</div>
