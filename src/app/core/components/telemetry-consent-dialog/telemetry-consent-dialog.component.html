<h2 class="title" mat-dialog-title>Error reporting</h2>

<div class="dialog-content" mat-dialog-content>
  <p class="message">
    Reports about failures in this interface help fix them. Choose how much may be sent. You can change this at any time
    under Account.
  </p>

  <mat-radio-group
    (change)="select($event.value)"
    [value]="selected()"
    aria-label="How much may be reported"
    class="options"
  >
    @for (option of options; track option.id) {
      <mat-radio-button [attr.data-level]="option.id" [value]="option.level" class="option">
        <span class="option-label">{{ option.label }}</span>
        <span class="option-description">{{ option.description }}</span>
      </mat-radio-button>
    }
  </mat-radio-group>
</div>

<div class="actions" mat-dialog-actions>
  <span class="mgw-spacer"></span>
  <button (click)="cancel()" mat-button>Not now</button>
  <button (click)="save()" mat-flat-button>Save</button>
</div>
