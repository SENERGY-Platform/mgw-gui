<div class="mgw-page">
  <mgw-page-header
    description="Credentials and certificates a deployment can reference. Values are stored by the secret manager and never shown again."
    title="Secrets"
  >
    <div pageActions>
      <button [routerLink]="'/resources/secrets/add'" mat-flat-button>
        <mat-icon>add</mat-icon>
        Add secret
      </button>
    </div>
  </mgw-page-header>

  <spinner [show]="!ready" class="global-centered-spinner"></spinner>

  @if (!ready && dataSource.data.length === 0) {
    <!-- first load: the spinner above is the only feedback -->
  } @else if (dataSource.data.length === 0) {
    <mgw-empty-state
      icon="key"
      message="Add a secret here, then reference it from a module's deployment form instead of pasting the value into a config field."
      title="No secrets yet"
    >
      <button [routerLink]="'/resources/secrets/add'" emptyAction mat-flat-button>Add secret</button>
    </mgw-empty-state>
  } @else {
    <div class="mgw-table-card">
      <table [dataSource]="dataSource" mat-table matSort matSortActive="name" matSortDirection="asc">
        <ng-container matColumnDef="name">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Name</th>
          <td *matCellDef="let secret" mat-cell>
            <div class="mgw-cell-stack">
              <span class="mgw-cell-primary">{{ secret.name }}</span>
              <span class="mgw-cell-secondary mgw-mono">{{ secret.id }}</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Type</th>
          <td *matCellDef="let secret" mat-cell>
            <span class="type-badge">{{ secretTypesDisplayNames[secret.type] }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th *matHeaderCellDef class="mgw-col-actions" mat-header-cell></th>
          <td *matCellDef="let secret" class="mgw-col-actions" mat-cell>
            <div class="mgw-row-actions">
              <button [routerLink]="'/resources/secrets/edit/' + secret.id" mat-icon-button matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button (click)="delete(secret.id)" class="mgw-danger" mat-icon-button matTooltip="Delete">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr *matHeaderRowDef="displayColumns; sticky: true" mat-header-row></tr>
        <tr *matRowDef="let m; columns: displayColumns" mat-row></tr>
      </table>
    </div>
  }
</div>
