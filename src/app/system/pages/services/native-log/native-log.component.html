<div class="mgw-page">
  <mgw-page-header
    backTo="/system/status"
    [description]="'system.nativeLog.description' | transloco"
    [title]="'system.nativeLog.title' | transloco"
  >
    <div pageActions>
      <mat-slide-toggle (change)="autoRefreshToggleChanged($event)" [ngModel]="autoRefreshEnabled">
        {{ 'system.nativeLog.autoRefresh' | transloco }}
      </mat-slide-toggle>
      <mat-form-field appearance="outline" class="lines" subscriptSizing="dynamic">
        <mat-label>{{ 'system.nativeLog.lines' | transloco }}</mat-label>
        <input (ngModelChange)="maxLinesChanges($event)" [(ngModel)]="maxLines" matInput type="number" />
      </mat-form-field>
    </div>
  </mgw-page-header>

  <div class="log-card">
    @if (ready && !init) {
      <mgw-log-viewer [logs]="logs" />
    } @else {
      <p class="loading">{{ 'system.nativeLog.loading' | transloco }}</p>
    }
  </div>
</div>
