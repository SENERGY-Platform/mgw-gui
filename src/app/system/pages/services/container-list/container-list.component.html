<section class="service-group">
  <header class="group-head">
    <h2>Container services</h2>
    <span class="count">{{ dataSource.data.length }}</span>
  </header>

  <spinner [show]="!ready && init"></spinner>

  @if (ready && dataSource.data.length === 0) {
    <p class="none">No container services found.</p>
  } @else if (dataSource.data.length > 0) {
    <div class="mgw-table-card">
      <table [dataSource]="dataSource" mat-table>
        <ng-container matColumnDef="name">
          <th *matHeaderCellDef mat-header-cell>Service</th>
          <td *matCellDef="let service" mat-cell>
            <div class="mgw-cell-stack">
              <span class="mgw-cell-primary">{{ service.name }}</span>
              <span class="mgw-cell-secondary mgw-mono">{{ service.image.repository }}</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th *matHeaderCellDef mat-header-cell>Status</th>
          <td *matCellDef="let service" mat-cell>
            <mgw-status-pill [label]="stateLabel(service)" [tone]="stateTone(service)"></mgw-status-pill>
          </td>
        </ng-container>

        <ng-container matColumnDef="version">
          <th *matHeaderCellDef mat-header-cell>Version</th>
          <td *matCellDef="let service" mat-cell>{{ service.image.tag }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th *matHeaderCellDef class="mgw-col-actions" mat-header-cell></th>
          <td *matCellDef="let service" class="mgw-col-actions" mat-cell>
            <div class="mgw-row-actions">
              <button (click)="showLogs(service.container.id)" mat-icon-button matTooltip="Show log">
                <mat-icon>article</mat-icon>
              </button>
              <button (click)="restart(service.name)" mat-icon-button matTooltip="Restart service">
                <mat-icon>restart_alt</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr *matHeaderRowDef="displayColumns; sticky: true" mat-header-row></tr>
        <tr *matRowDef="let m; columns: displayColumns;" mat-row></tr>
      </table>
    </div>
  }
</section>
