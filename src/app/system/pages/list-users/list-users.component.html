<div class="mgw-page">
  <mgw-page-header description="People who can sign in to this gateway." title="Users">
    <div pageActions>
      <button [routerLink]="'/system/accounts/add'" mat-flat-button>
        <mat-icon>person_add</mat-icon>
        Add user
      </button>
    </div>
  </mgw-page-header>

  <spinner [show]="!ready" class="global-centered-spinner"></spinner>

  @if (!ready && dataSource.data.length === 0) {
    <!-- first load: the spinner above is the only feedback -->
  } @else if (dataSource.data.length === 0) {
    <mgw-empty-state icon="group" message="No user accounts exist on this gateway yet." title="No users">
      <button [routerLink]="'/system/accounts/add'" emptyAction mat-flat-button>Add user</button>
    </mgw-empty-state>
  } @else {
    <div class="mgw-table-card">
      <table [dataSource]="dataSource" mat-table matSort matSortActive="username" matSortDirection="asc">
        <ng-container matColumnDef="username">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>User</th>
          <td *matCellDef="let user" mat-cell>
            <div class="mgw-cell-stack">
              <span class="mgw-cell-primary">{{ user.username }}</span>
              <span class="mgw-cell-secondary">{{ user.meta.first_name }} {{ user.meta.last_name }}</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th *matHeaderCellDef class="mgw-col-actions" mat-header-cell></th>
          <td *matCellDef="let user" class="mgw-col-actions" mat-cell>
            <div class="mgw-row-actions">
              <button (click)="editUser(user)" mat-icon-button matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button (click)="deleteUser(user.id)" class="danger-icon" mat-icon-button matTooltip="Delete">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr *matHeaderRowDef="displayColumns; sticky: true" mat-header-row></tr>
        <tr *matRowDef="let m; columns: displayColumns" mat-row></tr>
      </table>
    </div>
  }
</div>
