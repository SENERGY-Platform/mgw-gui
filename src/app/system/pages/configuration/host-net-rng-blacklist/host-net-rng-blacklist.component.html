<section class="config-group">
  <header class="group-head">
    <div>
      <h2>Blocked network ranges</h2>
      <p>Address ranges modules must not reach.</p>
    </div>
    <button (click)="addNetInterface()" mat-stroked-button>
      <mat-icon>add</mat-icon>
      Add
    </button>
  </header>

  @if (dataSource.data.length === 0) {
    <p class="none">No range is blocked.</p>
  } @else {
    <div class="mgw-table-card">
      <table [dataSource]="dataSource" mat-table matSort>
        <ng-container matColumnDef="range">
          <th *matHeaderCellDef mat-header-cell mat-sort-header sortActionDescription="Sort by range">Range</th>
          <td *matCellDef="let element" class="mgw-mono" mat-cell>{{ element }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th *matHeaderCellDef class="mgw-col-actions" mat-header-cell></th>
          <td *matCellDef="let element" class="mgw-col-actions" mat-cell>
            <div class="mgw-row-actions">
              <button (click)="removeNetRange(element)" class="danger-icon" mat-icon-button
                      matTooltip="Remove from blocklist">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
        <tr *matRowDef="let row; columns: displayedColumns;" mat-row></tr>
      </table>
    </div>
  }
</section>
