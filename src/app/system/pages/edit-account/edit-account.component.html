<div class="mgw-page mgw-page-narrow has-action-bar">
  <spinner [show]="!ready" class="global-centered-spinner"></spinner>

  @if (ready) {
    <mgw-page-header
      backTo="/system/accounts/users"
      [description]="'system.editAccount.description' | transloco"
      [title]="'system.editAccount.title' | transloco"
    ></mgw-page-header>

    <div [formGroup]="form" class="mgw-card card">
      <div class="field">
        <label for="acc-password">{{ 'system.editAccount.newPassword' | transloco }}</label>
        <mat-form-field appearance="outline" class="control" subscriptSizing="dynamic">
          <input formControlName="password" id="acc-password" matInput type="password" />
        </mat-form-field>
      </div>

      <div class="field">
        <label for="acc-confirm">{{ 'system.editAccount.confirmPassword' | transloco }}</label>
        <mat-form-field appearance="outline" class="control" subscriptSizing="dynamic">
          <input formControlName="confirmation" id="acc-confirm" matInput type="password" />
        </mat-form-field>
        @if (form.errors?.['match'] && (form.touched || form.dirty)) {
          <p class="field-error">
            <mat-icon>error</mat-icon>
            {{ getErrorMessage() }}
          </p>
        }
      </div>
    </div>

    <div class="mgw-action-bar">
      <span class="mgw-spacer"></span>
      <button [routerLink]="'/system/accounts/users'" mat-button>{{ 'system.editAccount.cancel' | transloco }}</button>
      <button (click)="edit()" [disabled]="!form.valid" mat-flat-button type="submit">
        {{ 'system.editAccount.save' | transloco }}
      </button>
    </div>
  }
</div>
