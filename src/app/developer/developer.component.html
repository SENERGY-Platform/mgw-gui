<div class="mgw-page">
  <mgw-page-header description="OpenAPI documentation for the gateway's services, grouped by who the API is meant for."
                   title="Developer"></mgw-page-header>

  <section class="api-group">
    <header>
      <h2>Public</h2>
      <p>APIs for app developers, reachable from outside the gateway.</p>
    </header>
    <app-swagger-list [items]="publicApis"></app-swagger-list>
  </section>

  <section class="api-group">
    <header>
      <h2>Module</h2>
      <p>Internal APIs a module may call from inside the gateway network.</p>
    </header>
    <app-swagger-list [items]="moduleApis"></app-swagger-list>
  </section>

  <section class="api-group">
    <header>
      <h2>Core</h2>
      <p>Internal APIs the core services use among themselves.</p>
    </header>
    <app-swagger-list [items]="internalApis"></app-swagger-list>
  </section>
</div>
